## NAS client NFS settings, only if `hmsdocker_media_share_type` is set to `nfs`
# The NFS remote share path to connect to // default: "nas.example.com:/share"
hmsdocker_nas_client_remote_nfs_path: "nas.example.com:/share"

# The NFS options to use for the mount, Google should be able to help troubleshoot // default: "defaults"
hmsdocker_nas_client_nfs_opts: defaults
