### Cloudflare settings

## DDNS
# Your Cloudflare API token that has read/write permissions for your DNS zone
# This will also be provided to Traefik if using SSL (assuming Cloudflare is your DNS provider)
hmsdocker_cloudflare_api_token: ""

# The domain that will be used for the Cloudflare DDNS container // default: "{{ hmsdocker_domain }}"
# Automatically uses the same domain defined in `main.yml`
hmsdocker_cloudflare_ddns_domain: "{{ hmsdocker_domain }}"

# The DNS zone (registered domain) the DDNS record lives in // default: last two labels of hmsdocker_cloudflare_ddns_domain
# Set explicitly for multi-label public suffixes (e.g. "example.co.uk" would otherwise become "co.uk")
hmsdocker_cloudflare_ddns_zone: "{{ hmsdocker_cloudflare_ddns_domain.split('.')[-2:] | join('.') }}"

# The A (or AAAA) record to be created // default: "hmsdpublic"
hmsdocker_cloudflare_ddns_subdomain: hmsdpublic

# Whether to proxy the above record through Cloudflare // default: "true"
hmsdocker_cloudflare_ddns_proxied: "true"

# Deletes the record when the container is stopped // default: "false"
hmsdocker_cloudflare_ddns_delete_record_on_stop: "false"

# Creates an AAAA record for IPv6 // default: "no"
hmsdocker_cloudflare_ddns_create_ipv6_aaaa_record: false


# Your Cloudflare Tunnel token, see https://developers.cloudflare.com/cloudflare-one/connections/connect-apps/install-and-setup/tunnel-guide/remote
# Be sure to only add the actual token, it will be a very long string of random characters
hmsdocker_cloudflare_tunnel_token: ""
