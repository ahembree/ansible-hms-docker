### CrowdSec Settings
# CrowdSec reads the reverse proxy's access logs and blocks abusive IPs on every route through it (ports 80 and 443), using
# the CrowdSec bouncer plugin (Traefik) or module (Caddy)
# Enable it with `crowdsec` in the container map. Requires Traefik or Caddy, and turns on their access logs while enabled
# The bouncer API key is generated automatically

# Optional: enroll this instance in the CrowdSec Console (https://app.crowdsec.net) with this enrollment key // default: ""
hmsdocker_crowdsec_enroll_key: ""

# Proxies in front of Traefik or Caddy (such as a load balancer) are set with `hmsdocker_traefik_trusted_proxies` in traefik.yml

# Version (release tag) of the CrowdSec bouncer Traefik plugin (https://github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin)
# The playbook downloads it from GitHub and Traefik loads it from that local copy // default: "v1.8.2"
hmsdocker_crowdsec_bouncer_plugin_version: v1.8.2

# Version (release tag) of the CrowdSec bouncer Caddy module (https://github.com/hslatman/caddy-crowdsec-bouncer)
# The playbook builds it into the Caddy image // default: "v0.15.0"
hmsdocker_crowdsec_caddy_bouncer_version: v0.15.0
