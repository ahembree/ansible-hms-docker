# The container map, use this to disable specific containers from running or being accessible by the reverse proxy (Traefik or Caddy)

# Values:
#  `authentik`: Enables or disables accessing the container via Authentik
#  `authentik_provider_type`: The type of Authentik provider. Default is `proxy`, add with value of `oauth2` (authentik_provider_type: oauth2) if you know the service uses OAuth2
#  `directory`: Creates the container directory within the apps folder
#  `enabled`: Enables or disables the container
#  `expose_ports`: Enables the container ports to be open on the host (so you can access the containers via <IP>:<port>)
#  `expose_to_public`: Enables or disables exposing the container to the public internet via the reverse proxy (removes allowlist restrictions, does not expose the container port)
#  `homepage`: Enables or disables Homepage container integration (if supported)
#  `homepage_stats`: Displays the container stats in Homepage (CPU, RAM, network traffic)
#  `proxy`: Enables or disables accessing the container via the reverse proxy, Traefik or Caddy (whichever is enabled). Called `traefik` in earlier releases, `make update` renames it
#  `proxy_host_rules`: Sets the host rules for the container (so you can access the container via "http://<host>.<domain>")

