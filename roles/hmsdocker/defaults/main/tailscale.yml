### Tailscale Settings
hmsdocker_tailscale_auth_key:
hmsdocker_tailscale_enable_subnet_routes: false # default: `no`
hmsdocker_tailscale_subnet_routes: '{{ hmsdocker_network_subnet }}' # comma-separated list of subnets to expose (such as '192.168.1.0/24,192.168.2.0/24'), default: '{{ hmsdocker_network_subnet }}'
hmsdocker_tailscale_advertise_exit_node: false # default: `no`
