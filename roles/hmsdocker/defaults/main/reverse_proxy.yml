]

### Logging and checks

# Enable or disable full request logging (access logs) // default: "no"
hmsdocker_proxy_access_logs: no

# Enable or disable to check if all possible routes are available at the end of the run (requires all FQDN DNS records to be valid) // default: "no"
hmsdocker_proxy_verify_endpoints: no
