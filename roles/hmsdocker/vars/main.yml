#######################################################################
# Computed variables
#######################################################################
### Misc
hmsdocker_primary_mount_path: "{{ hms_docker_mount_path }}/{{ hms_docker_primary_mount_name }}"
# hmsdocker_library_path is in defaults/main/hmsd_advanced.yml — as a role
# var here it would shadow inventory overrides.
#######################################################################


#######################################################################
### Advanced Ansible settings
# Overrides the family to 'redhat' if running Alma Linux
hmsdocker_family_override: "{{ 'redhat' if ansible_os_family | lower == 'almalinux' else ansible_os_family | lower }}"

# Which python interpreter to use, only change if you're an advanced user and know what you're doing
ansible_python_interpreter: /usr/bin/python3
#######################################################################

# Containers whose media share mount honors hmsdocker_readonly_media_containers.
# Listing any other container there has no effect and triggers a preflight warning.
# checkrr and librariarr always mount the media share read-only, so listing them is valid but changes nothing.
hmsdocker_readonly_media_supported_containers:
  - calibre
  - checkrr
  - emby
  - jellyfin
  - kavita
  - librariarr
  - plex
