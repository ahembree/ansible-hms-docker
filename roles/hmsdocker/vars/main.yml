#######################################################################
# Computed variables
#######################################################################
### Misc
hmsdocker_primary_mount_path: "{{ hms_docker_mount_path }}/{{ hms_docker_primary_mount_name }}"
# hmsdocker_library_path is in defaults/main/hmsd_advanced.yml — as a role
# var here it would shadow inventory overrides.
#######################################################################


#######################################################################
### Advanced Ansible settings
# Overrides the family to 'redhat' if running Alma Linux
hmsdocker_family_override: "{{ 'redhat' if ansible_os_family | lower == 'almalinux' else ansible_os_family | lower }}"

# Which python interpreter to use, only change if you're an advanced user and know what you're doing
ansible_python_interpreter: /usr/bin/python3
#######################################################################

# Containers whose media share mount honors hmsdocker_readonly_media_containers.
# Listing any other container there has no effect and triggers a preflight warning.
# checkrr and librariarr always mount the media share read-only, so listing them is valid but changes nothing.
hmsdocker_readonly_media_supported_containers:
  - audiobookshelf
  - calibre
  - checkrr
  - emby
  - ersatztv
  - jellyfin
  - kavita
  - librariarr
  - plex
  - tunarr

# Docker socket proxy (`socket-proxy` in the container map).
# Each container below with `mode: proxy` gets its own socket-proxy container. That container creates a filtered Docker
# socket in apps/socket-proxy/<container>/, which is mounted at hmsdocker_socket_proxy_client_dir inside the client.
# The directory is mounted instead of the socket file because the proxy recreates the socket file every time it starts.
# Users change these with hmsdocker_socket_proxy_overrides (container_settings.yml), not here.
#   mode:            proxy = filtered socket, none = no Docker socket, direct = unfiltered Docker socket
#   modes:           the modes users may choose for this container. Containers that cannot work without Docker
#                    do not allow "none"
#   allow:           Docker API path regexes per HTTP method. socket-proxy anchors each with ^ and $ and matches
#                    the URL path only (no query string). `(/v1\.\d+)?` covers versioned and unversioned paths.
#   bind_mount_from: host directories allowed as bind mount sources when the client creates containers
#   labels:          extra labels for the client's socket-proxy container
#   requires_ssl:    the client container only runs when traefik_ssl_enabled is on
# Left out on purpose:
#   netdata          mounts the host root (/), which already contains the Docker socket
#   portainer, dockhand  container management UIs that need the whole Docker API
hmsdocker_socket_proxy_client_dir: /var/run/socket-proxy
hmsdocker_socket_proxy_image: docker.io/wollomatic/socket-proxy:1
hmsdocker_socket_proxy_log_levels: [debug, info, warn, error]
hmsdocker_socket_proxy_methods: [get, head, post, put, patch, delete]
hmsdocker_socket_proxy_builtin_clients:
  # Authentik worker: creates, restarts and removes its proxy outpost containers
  authentik:
    mode: proxy
    modes: [proxy, direct]
    requires_ssl: true
    allow:
      get:
        - '(/v1\.\d+)?/(_ping|version|info|containers/json|containers/[^/]+/json|images/json|networks|networks/[^/]+)'
        - '(/v1\.\d+)?/images/.+/json'
      head:
        - '(/v1\.\d+)?/_ping'
      post:
        - '(/v1\.\d+)?/(containers/create|containers/[^/]+/(start|stop|kill|restart|wait)|images/create)'
      delete:
        - '(/v1\.\d+)?/containers/[^/]+'
    # Outposts need no bind mounts, so allow none (nothing is ever mounted from this path)
    bind_mount_from:
      - /nonexistent
  # Beszel agent: container list, stats, details and logs
  beszel:
    mode: proxy
    modes: [proxy, none, direct]
    allow:
      get:
        - '(/v1\.\d+)?/(_ping|version|info|containers/json|containers/[^/]+/(json|stats|logs))'
        - '(/v1\.\d+)?/images/.+/json'
      head:
        - '(/v1\.\d+)?/_ping'
  # CrowdSec: Docker log acquisition (finds the traefik or caddy container through the container list and events, then reads its logs)
  crowdsec:
    mode: proxy
    modes: [proxy, direct]
    allow:
      get:
        - '(/v1\.\d+)?/(_ping|version|info|events|containers/json|containers/[^/]+/(json|logs))'
      head:
        - '(/v1\.\d+)?/_ping'
  # Homepage: container discovery, status and stats
  homepage:
    mode: proxy
    modes: [proxy, direct]
    allow:
      get:
        - '(/v1\.\d+)?/(_ping|version|containers/json|containers/[^/]+/(json|stats))'
      head:
        - '(/v1\.\d+)?/_ping'
  # Traefik: Docker provider (container labels and events)
  traefik:
    mode: proxy
    modes: [proxy, direct]
    allow:
      get:
        - '(/v1\.\d+)?/(_ping|version|events|containers/json|containers/[^/]+/json)'
      head:
        - '(/v1\.\d+)?/_ping'
  # Tinyauth: reads access-control labels from containers (label provider)
  tinyauth:
    mode: proxy
    modes: [proxy, none, direct]
    allow:
      get:
        - '(/v1\.\d+)?/(_ping|version|events|containers/json|containers/[^/]+/json)'
      head:
        - '(/v1\.\d+)?/_ping'
  # Uptime Kuma: Docker container monitors
  uptimekuma:
    mode: proxy
    modes: [proxy, none, direct]
    allow:
      get:
        - '(/v1\.\d+)?/(_ping|version|info|containers/json|containers/[^/]+/json)'
      head:
        - '(/v1\.\d+)?/_ping'
  # Watchtower: pulls images and recreates containers. It must recreate containers with their existing
  # bind mounts, so bind mounts cannot be restricted for it
  watchtower:
    mode: proxy
    modes: [proxy, direct]
    allow:
      get:
        - '(/v1\.\d+)?/(_ping|version|info|events|containers/json|containers/[^/]+/json|images/json|networks|networks/[^/]+)'
        - '(/v1\.\d+)?/(images|distribution)/.+/json'
      head:
        - '(/v1\.\d+)?/_ping'
      post:
        - '(/v1\.\d+)?/(containers/create|containers/[^/]+/(start|stop|kill|restart|rename|wait)|images/create|networks/[^/]+/(connect|disconnect))'
      delete:
        - '(/v1\.\d+)?/(containers/[^/]+|images/.+)'
    # Watchtower reaches Docker through this proxy, so it must not update (stop) it. The playbook pulls
    # the proxy image on every run instead
    labels:
      - com.centurylinklabs.watchtower.enable=false

# Containers that cannot be put behind Tinyauth with hmsdocker_tinyauth_protected_containers:
# tinyauth and pocketid serve the sign-in itself, authentik and n8n set their own Traefik middlewares
hmsdocker_tinyauth_unsupported_containers: [tinyauth, pocketid, authentik, n8n]

# Tinyauth sign-in with Pocket ID (settings in defaults/main/sso.yml)
# external: Tinyauth uses the Pocket ID at hmsdocker_tinyauth_pocketid_url instead of the pocketid container
hmsdocker_tinyauth_pocketid_base_url: "{{ hmsdocker_tinyauth_pocketid_url | default('', true) | regex_replace('/+$', '') }}"
hmsdocker_tinyauth_pocketid_external: "{{ (hmsdocker_tinyauth_pocketid_enabled | default(false) | bool) and (hmsdocker_tinyauth_pocketid_base_url | length > 0) }}"
hmsdocker_tinyauth_pocketid_local: "{{ (hmsdocker_tinyauth_pocketid_enabled | default(false) | bool) and (hmsdocker_tinyauth_pocketid_base_url | length == 0) }}"
# The playbook creates the OIDC client itself, unless an external Pocket ID has no API key to do it with
hmsdocker_tinyauth_pocketid_manage_client: "{{ (hmsdocker_tinyauth_pocketid_local | bool) or ((hmsdocker_tinyauth_pocketid_external | bool) and (hmsdocker_tinyauth_pocketid_api_key | default('', true) | length > 0)) }}"

# CrowdSec bouncer Traefik plugin. Traefik loads it as a local plugin from /plugins-local/src/<module>, which is a
# mount of apps/crowdsec/bouncer-plugin/<version>. A new version changes the mount, so Compose recreates Traefik with it
hmsdocker_crowdsec_bouncer_plugin_module: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
hmsdocker_crowdsec_bouncer_plugin_mount: "/plugins-local/src/{{ hmsdocker_crowdsec_bouncer_plugin_module }}"

# CrowdSec bouncer Caddy module, built into the Caddy image (with the AppSec module it always pulls in)
hmsdocker_crowdsec_caddy_bouncer_module: "github.com/hslatman/caddy-crowdsec-bouncer/http@{{ hmsdocker_crowdsec_caddy_bouncer_version }}"

# The reverse proxy the CrowdSec bouncer runs in, and the name it is registered with in CrowdSec. CrowdSec reads this
# proxy's logs (with the crowdsecurity/<name> collection)
hmsdocker_crowdsec_bouncer_name: "{{ 'caddy' if (hms_docker_container_map['caddy']['enabled'] | default(false) | bool) else 'traefik' }}"

# Caddy (`caddy` in the container map) routes each container with `traefik: true` to the upstream below, the same
# container and port that its Traefik labels use. Containers with `traefik: true` but no entry here (no web UI,
# e.g. unpackerr) get no Caddy route. When adding a container with a web UI, add it here as well.
#   host:        container name on proxy_net // default: the container map key
#   port:        web UI port inside the container
#   scheme:      https when the container only serves HTTPS, its certificate is not verified // default: http
#   separate_4k: also routes `<proxy_host_rule>-4k` to `<host>-4k` while separate_4k_instances_enable is on
#   allowlist:   false skips the IP allowlist and the sign-ins, like the Traefik router of n8n // default: true
#   sso:         false never puts Authentik or Tinyauth in front of it (Authentik itself) // default: true
#   headers:     response headers to set
hmsdocker_caddy_upstreams:
  audiobookshelf: { port: 80 }
  authentik: { host: authentik-server, port: 9443, scheme: https, sso: false }
  autobrr: { port: 7474 }
  backrest: { port: 9898 }
  bazarr: { port: 6767 }
  beszel: { port: 8090 }
  calibre: { port: 8181, scheme: https }
  checkrr: { port: 8585 }
  cleanuparr: { port: 11011 }
  deluge: { port: 8112 }
  dispatcharr: { port: 9191 }
  dockhand: { port: 3000 }
  emby: { port: 8096 }
  ersatztv: { port: 8409 }
  fileflows: { port: 5000 }
  heimdall: { port: 443, scheme: https }
  homepage: { port: 3000 }
  jellyfin: { port: 8096 }
  jellyseerr: { port: 5055 }
  kavita: { port: 5000 }
  librariarr: { port: 3000 }
  lidarr: { port: 8686 }
  maintainerr: { port: 6246 }
  n8n:
    port: 5678
    allowlist: false
    headers:
      Strict-Transport-Security: "max-age=315360000; includeSubDomains; preload"
      X-XSS-Protection: "1; mode=block"
      X-Content-Type-Options: nosniff
  nexroll: { port: 9393 }
  notifiarr: { port: 5454 }
  nzbget: { port: 6789 }
  overseerr: { port: 5055 }
  pasta: { port: 80 }
  pinchflat: { port: 8945 }
  plex: { port: 32400, scheme: https }
  pocketid: { port: 1411 }
  portainer: { port: 9000 }
  prowlarr: { port: 9696 }
  qbittorrent: { port: 8086 }
  radarr: { port: 7878, separate_4k: true }
  requestrr: { port: 4545 }
  sabnzbd: { port: 8080 }
  scrutiny: { port: 8080 }
  seerr: { port: 5055 }
  sonarr: { port: 8989, separate_4k: true }
  speedtest-tracker: { port: 80 }
  spottarr: { port: 8383 }
  tautulli: { port: 8181 }
  tdarr: { port: 8265 }
  tinyauth: { port: 3000 }
  tinymediamanager: { port: 4000 }
  tracearr: { port: 3000 }
  transmission: { host: transmission-proxy, port: 8080 }
  tubearchivist: { port: 8001 }
  tunarr: { port: 8000 }
  unmanic: { port: 8888 }
  uptimekuma: { host: uptime-kuma, port: 3001 }
  wizarr: { port: 5690 }

# Response headers Caddy adds to every route while traefik_security_hardening is on (Traefik's secure-headers middleware)
hmsdocker_caddy_security_headers:
  X-Frame-Options: DENY
  X-Content-Type-Options: nosniff

# Headers the Authentik outpost returns that Caddy passes to the service (capitalization matters)
hmsdocker_caddy_authentik_headers:
  - X-Authentik-Username
  - X-Authentik-Groups
  - X-Authentik-Entitlements
  - X-Authentik-Email
  - X-Authentik-Name
  - X-Authentik-Uid
  - X-Authentik-Jwt
  - X-Authentik-Meta-Jwks
  - X-Authentik-Meta-Outpost
  - X-Authentik-Meta-Provider
  - X-Authentik-Meta-App
  - X-Authentik-Meta-Version

# Image Caddy runs: the official image, or one built with the DNS provider (SSL), the CrowdSec bouncer and extra modules
hmsdocker_caddy_build_modules: >-
  {{
    ([hmsdocker_caddy_dns_provider_module] if (traefik_ssl_enabled | default(false) | bool) else [])
    + ([hmsdocker_crowdsec_caddy_bouncer_module] if (hms_docker_container_map['crowdsec']['enabled'] | default(false) | bool) else [])
    + (hmsdocker_caddy_extra_modules | default([], true))
  }}
hmsdocker_caddy_image: >-
  {{
    ('hmsd-caddy:' ~ hmsdocker_caddy_version ~ '-' ~ (hmsdocker_caddy_build_modules | join(' ') | hash('sha1'))[:12])
    if (hmsdocker_caddy_build_modules | length > 0)
    else ('docker.io/library/caddy:' ~ hmsdocker_caddy_version)
  }}
