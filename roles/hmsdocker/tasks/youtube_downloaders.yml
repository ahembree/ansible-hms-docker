# No `mode`: these folders are on the media share, whose permissions are left as they are
- name: Ensure Youtube media dir exists  # noqa: risky-file-permissions
  ansible.builtin.file:
    path: "{{ hmsdocker_mount_path }}/{{ hmsdocker_primary_mount_name }}/{{ hmsdocker_library_folder_name }}/youtube"
    state: directory
  when: '"tubearchivist" in hmsdocker_enabled_containers or "pinchflat" in hmsdocker_enabled_containers'

- name: Ensure Youtube downloader media dir exists  # noqa: risky-file-permissions
  ansible.builtin.file:
    path: "{{ hmsdocker_mount_path }}/{{ hmsdocker_primary_mount_name }}/{{ hmsdocker_library_folder_name }}/youtube/{{ item }}"
    state: directory
  loop:
    - tubearchivist
    - pinchflat
  when: item in hmsdocker_enabled_containers
