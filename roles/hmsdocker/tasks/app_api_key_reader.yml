- name: (API Key Reader) Parse and normalize all service configs
  no_log: "{{ not hmsdocker_debug_mode }}"
  ansible.builtin.set_fact:
    hmsdocker_service_configs: "{{ hmsdocker_service_configs_json | trim | from_json }}"
  vars:
    hmsdocker_service_config_sources:
      # Sabnzbd is not here because it does not have valid INI file syntax by default and adding support for it was too much of a pain
      # So, it uses regex further below
      - { name: radarr_config, varname: hmsdocker_slurped_config_radarr, type: xml }
      - { name: radarr_4k_config, varname: hmsdocker_slurped_config_radarr_4k, type: xml }
      - { name: lidarr_config, varname: hmsdocker_slurped_config_lidarr, type: xml }
      - { name: sonarr_config, varname: hmsdocker_slurped_config_sonarr, type: xml }
      - { name: sonarr_4k_config, varname: hmsdocker_slurped_config_sonarr_4k, type: xml }
      - { name: bazarr_config, varname: hmsdocker_slurped_config_bazarr, type: yaml }
      - { name: overseerr_config, varname: hmsdocker_slurped_config_overseerr, type: json }
      - { name: jellyseerr_config, varname: hmsdocker_slurped_config_jellyseerr, type: json }
      - { name: seerr_config, varname: hmsdocker_slurped_config_seerr, type: json }
      - { name: tautulli_config, varname: hmsdocker_slurped_config_tautulli, type: ini }
      - { name: plex_config, varname: hmsdocker_slurped_config_plex, type: xml }
      - { name: prowlarr_config, varname: hmsdocker_slurped_config_prowlarr, type: xml }

    # ChatGPT wrote this, please do not ask me how it works because I don't know :)
    hmsdocker_service_configs_json: >-
      {% set res = {} %}
      {% for item in hmsdocker_service_config_sources %}
        {% set slurped = lookup('vars', item.varname, default={}) %}
        {% set content = slurped.get('content', '') | b64decode | trim %}
        {% set parsed = {} %}
        {% if content %}
          {% if item.type == 'xml' %}
            {% set parsed = content | ansible.utils.from_xml %}
          {% elif item.type == 'ini' %}
            {% set parsed = content | community.general.from_ini %}
          {% elif item.type == 'json' %}
            {% set parsed = content | from_json %}
          {% elif item.type == 'yaml' %}
            {% set parsed = content | from_yaml %}
          {% endif %}
        {% endif %}
        {% if parsed is string %}
          {% set parsed = parsed | from_yaml %}
        {% endif %}
        {% set _ = res.update({item.name: parsed}) %}
      {% endfor %}
      {# Serialize as JSON so values containing quotes survive the render round trip. #}
      {{ res | to_json }}

- name: (API Key Reader) Initialize empty API keys dict
  no_log: "{{ not hmsdocker_debug_mode }}"
  ansible.builtin.set_fact:
    hmsdocker_api_keys: {}

- name: (API Key Reader) Set all service API keys
  no_log: "{{ not hmsdocker_debug_mode }}"
  ansible.builtin.set_fact:
    hmsdocker_api_keys: >-
      {{
        {
          'sonarr_key': hmsdocker_service_configs.get('sonarr_config', {}).get('Config', {}).get('ApiKey', ''),
          'sonarr_4k_key': hmsdocker_service_configs.get('sonarr_4k_config', {}).get('Config', {}).get('ApiKey', ''),
          'radarr_key': hmsdocker_service_configs.get('radarr_config', {}).get('Config', {}).get('ApiKey', ''),
          'radarr_4k_key': hmsdocker_service_configs.get('radarr_4k_config', {}).get('Config', {}).get('ApiKey', ''),
          'prowlarr_key': hmsdocker_service_configs.get('prowlarr_config', {}).get('Config', {}).get('ApiKey', ''),
          'bazarr_key': hmsdocker_service_configs.get('bazarr_config', {}).get('auth', {}).get('apikey', ''),
          'overseerr_key': hmsdocker_service_configs.get('overseerr_config', {}).get('main', {}).get('apiKey', ''),
          'jellyseerr_key': hmsdocker_service_configs.get('jellyseerr_config', {}).get('main', {}).get('apiKey', ''),
          'seerr_key': hmsdocker_service_configs.get('seerr_config', {}).get('main', {}).get('apiKey', ''),
          'tautulli_key': hmsdocker_service_configs.get('tautulli_config', {}).get('General', {}).get('api_key', ''),
          'plex_key': hmsdocker_service_configs.get('plex_config', {}).get('Preferences', {}).get('@PlexOnlineToken', ''),
          'lidarr_key': hmsdocker_service_configs.get('lidarr_config', {}).get('Config', {}).get('ApiKey', ''),
          'sabnzbd_key': (hmsdocker_slurped_config_sabnzbd['content'] | default('') | b64decode | regex_search('(?m)^api_key\s*=\s*(\S+)', '\1'))[0] | default('')
        }
      }}
