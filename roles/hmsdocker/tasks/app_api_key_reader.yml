- name: (API Key Reader) Handle Sonarr configs
  when: "'sonarr' in hmsdocker_enabled_containers"
  block:
    - name: Check for Sonarr config file
      ansible.builtin.stat:
        path: "{{ hmsdocker_apps_path }}/sonarr/config/config.xml"
      register: hmsdocker_sonarr_conf_path

    - name: Slurp Sonarr config data
      ansible.builtin.slurp:
        src: "{{ hmsdocker_sonarr_conf_path.stat.path }}"
      register: hmsdocker_slurped_config_sonarr
      when:
        - hmsdocker_sonarr_conf_path.stat.exists

    - name: Check for Sonarr 4K config file
      ansible.builtin.stat:
        path: "{{ hmsdocker_apps_path }}/sonarr-4k/config/config.xml"
      register: hmsdocker_sonarr_4k_conf_path

    - name: Slurp Sonarr 4K config data
      ansible.builtin.slurp:
        src: "{{ hmsdocker_sonarr_4k_conf_path.stat.path }}"
      register: hmsdocker_slurped_config_sonarr_4k
      when: hmsdocker_separate_4k_instances_enable and hmsdocker_sonarr_4k_conf_path.stat.exists

