# Creates the Tinyauth OIDC client in Pocket ID through its API.
# The pocketid container is called on its container IP with the static API key from its prereqs, so this does not
# depend on DNS or Traefik. An external Pocket ID (hmsdocker_tinyauth_pocketid_url) is called on its URL with
# hmsdocker_tinyauth_pocketid_api_key.
- name: (Postreq - Tinyauth) - Ensure Pocket ID OIDC client
  when:
    - hmsdocker_tinyauth_pocketid_manage_client | bool
    - not ansible_check_mode
  vars:
    pocketid_client_id: "{{ hmsdocker_tinyauth_pocketid_client_id }}"
    pocketid_callback_url: "https://{{ hms_docker_container_map['tinyauth']['proxy_host_rule'] | default('tinyauth') }}.{{ hms_docker_domain }}/api/oauth/callback/pocketid"
  block:
    - name: (Postreq - Tinyauth) - Get Pocket ID container
      community.docker.docker_container_info:
        name: pocketid
      register: pocketid_container_info
      when: hmsdocker_tinyauth_pocketid_local | bool

    - name: (Postreq - Tinyauth) - Read Pocket ID static API key
      ansible.builtin.slurp:
        src: "{{ hms_docker_apps_path }}/pocketid/config/.pocketid_static_api_key"
      register: pocketid_slurped_api_key
      when: hmsdocker_tinyauth_pocketid_local | bool
      no_log: "{{ not debug_mode }}"

    - name: (Postreq - Tinyauth) - Read Pocket ID client secret
      ansible.builtin.slurp:
        src: "{{ hms_docker_apps_path }}/tinyauth/config/.pocketid_client_secret"
      register: pocketid_slurped_client_secret
      no_log: "{{ not debug_mode }}"

    - name: (Postreq - Tinyauth) - Set Pocket ID API facts
      ansible.builtin.set_fact:
        pocketid_api_url: >-
          {{
            hmsdocker_tinyauth_pocketid_base_url
            if hmsdocker_tinyauth_pocketid_external | bool
            else 'http://' + (pocketid_container_info.container.NetworkSettings.Networks | dict2items
              | map(attribute='value.IPAddress') | select | first) + ':1411'
          }}
        pocketid_api_key: >-
          {{
            hmsdocker_tinyauth_pocketid_api_key
            if hmsdocker_tinyauth_pocketid_external | bool
            else pocketid_slurped_api_key.content | b64decode | trim
          }}
        pocketid_client_secret: "{{ pocketid_slurped_client_secret.content | b64decode | trim }}"
      no_log: "{{ not debug_mode }}"

    - name: (Postreq - Tinyauth) - Wait for Pocket ID
      ansible.builtin.uri:
        url: "{{ pocketid_api_url }}/healthz"
        status_code: [200, 204]
      register: pocketid_health
      until: pocketid_health.status in [200, 204]
      retries: 30
      delay: 2

    - name: (Postreq - Tinyauth) - Get Tinyauth OIDC client
      ansible.builtin.uri:
        url: "{{ pocketid_api_url }}/api/oidc/clients/{{ pocketid_client_id }}"
        headers:
          X-API-Key: "{{ pocketid_api_key }}"
        status_code: [200, 404]
        return_content: true
      register: pocketid_client
      no_log: "{{ not debug_mode }}"

    - name: (Postreq - Tinyauth) - Create Tinyauth OIDC client
      ansible.builtin.uri:
        url: "{{ pocketid_api_url }}/api/oidc/clients"
        method: POST
        headers:
          X-API-Key: "{{ pocketid_api_key }}"
        body_format: json
        body:
          id: "{{ pocketid_client_id }}"
          name: Tinyauth
          callbackURLs:
            - "{{ pocketid_callback_url }}"
          isPublic: false
        status_code: 201
        return_content: true
      register: pocketid_client_created
      changed_when: true
      when: pocketid_client.status == 404
      no_log: "{{ not debug_mode }}"

    # Pocket ID can be set to generate a secret for every new client. The playbook uses its own secret instead
    - name: (Postreq - Tinyauth) - Remove secret generated by Pocket ID
      ansible.builtin.uri:
        url: "{{ pocketid_api_url }}/api/oidc/clients/{{ pocketid_client_id }}/secrets/{{ pocketid_client_created.json.createdSecret.id }}"
        method: DELETE
        headers:
          X-API-Key: "{{ pocketid_api_key }}"
        status_code: 204
      changed_when: true
      when:
        - pocketid_client_created is not skipped
        - pocketid_client_created.json.createdSecret.id | default('', true) | length > 0
      no_log: "{{ not debug_mode }}"

    - name: (Postreq - Tinyauth) - Add Tinyauth callback URL to existing client
      ansible.builtin.uri:
        url: "{{ pocketid_api_url }}/api/oidc/clients/{{ pocketid_client_id }}"
        method: PUT
        headers:
          X-API-Key: "{{ pocketid_api_key }}"
        body_format: json
        body: "{{ pocketid_client.json | combine({'callbackURLs': (pocketid_client.json.callbackURLs | default([], true)) + [pocketid_callback_url]}) }}"
        status_code: 200
      changed_when: true
      when:
        - pocketid_client.status == 200
        - pocketid_callback_url not in (pocketid_client.json.callbackURLs | default([], true))
      no_log: "{{ not debug_mode }}"

    - name: (Postreq - Tinyauth) - Get Tinyauth client secrets
      ansible.builtin.uri:
        url: "{{ pocketid_api_url }}/api/oidc/clients/{{ pocketid_client_id }}/secrets"
        headers:
          X-API-Key: "{{ pocketid_api_key }}"
        status_code: 200
        return_content: true
      register: pocketid_client_secrets
      no_log: "{{ not debug_mode }}"

    # Pocket ID only returns the first characters of a stored secret, which is enough to tell whether ours is there
    - name: (Postreq - Tinyauth) - Add Tinyauth client secret
      ansible.builtin.uri:
        url: "{{ pocketid_api_url }}/api/oidc/clients/{{ pocketid_client_id }}/secrets"
        method: POST
        headers:
          X-API-Key: "{{ pocketid_api_key }}"
        body_format: json
        body:
          secret: "{{ pocketid_client_secret }}"
        status_code: 201
      changed_when: true
      when: >-
        pocketid_client_secrets.json | default([], true)
        | selectattr('isActive', 'equalto', true)
        | selectattr('prefix', 'equalto', pocketid_client_secret[:4])
        | list | length == 0
      no_log: "{{ not debug_mode }}"
