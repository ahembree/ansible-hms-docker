- name: Traefik Postreq - Verify all Traefik endpoints are accessible
  ansible.builtin.uri:
    url: http://{{ item }}.{{ hmsdocker_domain }}
    status_code: 200,302,401,403
    validate_certs: false
  loop: "{{ hmsdocker_traefik_enabled_subdomains }}"
  when:
    - "'traefik' in hmsdocker_enabled_containers"
    - hmsdocker_traefik_verify_endpoints | default(false)
  ignore_errors: true
  register: hmsdocker_traefik_successful_endpoints
