---
# Generates a random per-install secret, stores it in a root-only file and exposes it to env.j2 as
# hmsdocker_generated_secrets[secret_name].
#
# Vars:
#   secret_name             key in hmsdocker_generated_secrets
#   secret_dest             path of the secret file
#   secret_legacy_value     the fixed password older releases used
#   secret_existing_install true if the service's data already exists. Its database was initialized
#                           with the legacy password and changing the env var does not change the
#                           stored password, so the legacy value is kept and the service keeps working.
#
# The file is only written once (force: no). To rotate a password later, change it in the database
# and put the new value in the file.
- name: "(Generated secret) Ensure secret file - {{ secret_name }}"
  ansible.builtin.template:
    src: secret_key_file.j2
    dest: "{{ secret_dest }}"
    owner: root
    group: root
    mode: '0600'
    force: no
  no_log: "{{ not debug_mode }}"
  # The parent directory does not exist yet in check mode on a new install
  ignore_errors: "{{ ansible_check_mode }}"
  vars:
    key: "{{ secret_legacy_value if (secret_existing_install | bool) else lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=48) }}"

- name: "(Generated secret) Check secret file - {{ secret_name }}"
  ansible.builtin.stat:
    path: "{{ secret_dest }}"
  register: generated_secret_stat

- name: "(Generated secret) Read secret file - {{ secret_name }}"
  ansible.builtin.slurp:
    src: "{{ secret_dest }}"
  register: generated_secret_slurped
  check_mode: false
  when: generated_secret_stat.stat.exists
  no_log: "{{ not debug_mode }}"

- name: "(Generated secret) Set fact - {{ secret_name }}"
  ansible.builtin.set_fact:
    hmsdocker_generated_secrets: >-
      {{ hmsdocker_generated_secrets | default({}) | combine({
           secret_name: (generated_secret_slurped['content'] | b64decode | trim)
                        if generated_secret_slurped['content'] is defined
                        else '### Will be obtained during full run ###'
         }) }}
  no_log: "{{ not debug_mode }}"
