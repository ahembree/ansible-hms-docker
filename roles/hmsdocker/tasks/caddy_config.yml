---
# The Caddyfile. Used by the Caddy prereqs, and by the Caddy postreqs when the prereqs had to wait for Compose to
# recreate Caddy with its new image (see caddy_config_deferred in container_prereqs/caddy.yml)
- name: Caddy - Ensure Caddyfile
  ansible.builtin.template:
    src: caddy/Caddyfile.j2
    dest: "{{ hms_docker_apps_path }}/caddy/config/Caddyfile"
    mode: '0640'
    group: docker
    backup: true
    lstrip_blocks: true
    trim_blocks: true
  notify: Reload caddy
