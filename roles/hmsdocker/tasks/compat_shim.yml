---
# Compatibility shim for deprecated/renamed inventory variables.
#
# When a user upgrades, their inventory may still define old variable names.
# Rather than failing (or requiring them to run `make update` first), this
# task aliases each deprecated variable to its new name in-memory and appends
# a notice to hmsdocker_preflight_warnings so the user knows to update their
# inventory at their leisure.
#
# The rename map is the `renames` list of migrations/variable_renames.yml at
# the repo root, shared with migrations/apply_renames.py (`make update`).
# Register new renames there, not here. Re-runs are safe: entries whose `old`
# is unset in the resolved vars are silently skipped.

- name: (compat) Load variable migration map from single source
  ansible.builtin.set_fact:
    hmsdocker_variable_migrations: >-
      {{
        (lookup('file', playbook_dir ~ '/migrations/variable_renames.yml')
         | from_yaml).renames
      }}

# `q('varnames', '.*')` returns the names of all currently-resolved
# variables. We snapshot it once so all later steps agree on which
# migrations are active, and intersect it with the migration map to find
# deprecated names the user actually set.
- name: (compat) Determine which deprecated variables are in use
  ansible.builtin.set_fact:
    hmsdocker_active_migrations: >-
      {{
        hmsdocker_variable_migrations
        | selectattr('old', 'in', q('varnames', '.*'))
        | list
      }}

# hostvars holds inventory-sourced vars but not role defaults, so membership
# means the user explicitly set the new name. Must be snapshotted before
# aliasing, because the aliases add the new names to hostvars.
- name: (compat) Snapshot which new names the user set explicitly
  ansible.builtin.set_fact:
    hmsdocker_user_set_new_names: >-
      {{
        hmsdocker_active_migrations
        | map(attribute='new')
        | select('in', hostvars[inventory_hostname])
        | list
      }}

# Each alias is a variable `new_name: "{{ old_name }}"`, loaded with include_vars from a temporary
# file on the controller. It is a reference, not a copy, so the new name always has exactly the
# value and type of the old one (false, "", [], null, a string "true", ...) on every Ansible
# version. set_fact cannot do this: it evaluates the value once, and before Ansible 2.19 it turns
# numbers into text and the strings "true"/"false"/"yes"/"no" into booleans.
# Names the user already set are not aliased, their own value wins.
- name: (compat) Alias deprecated variables to their new names
  when: hmsdocker_alias_migrations | length > 0
  vars:
    hmsdocker_alias_migrations: "{{ hmsdocker_active_migrations | rejectattr('new', 'in', hmsdocker_user_set_new_names) | list }}"
  block:
    - name: (compat) Create a temporary file for the aliases
      ansible.builtin.tempfile:
        suffix: .hmsdocker-aliases.yml
      register: hmsdocker_alias_file
      delegate_to: localhost
      become: false
      check_mode: false
      changed_when: false

    - name: (compat) Write the aliases
      ansible.builtin.copy:
        dest: "{{ hmsdocker_alias_file.path }}"
        mode: '0600'
        content: |
          {% for hmsdocker_alias in hmsdocker_alias_migrations %}
          {{ hmsdocker_alias.new }}: "{% raw %}{{ {% endraw %}{{ hmsdocker_alias.old }}{% raw %} }}{% endraw %}"
          {% endfor %}
      delegate_to: localhost
      become: false
      check_mode: false
      changed_when: false
      diff: false

    - name: (compat) Load the aliases
      ansible.builtin.include_vars:
        file: "{{ hmsdocker_alias_file.path }}"
  always:
    - name: (compat) Remove the temporary file
      ansible.builtin.file:
        path: "{{ hmsdocker_alias_file.path }}"
        state: absent
      delegate_to: localhost
      become: false
      check_mode: false
      changed_when: false
      when: hmsdocker_alias_file.path is defined

# One warning for all renamed variables that are simply still under their old name (an inventory
# from before the hmsdocker_ prefix has about a hundred of them), and one per variable that is set
# under both names, because those need a manual fix.
- name: (compat) Record deprecation warnings for renamed variables
  ansible.builtin.set_fact:
    hmsdocker_preflight_warnings: >-
      {{
        hmsdocker_preflight_warnings
        + (
            [
              "DEPRECATED: " ~ (hmsdocker_migrations_old_only | length) ~ " variable(s) in your inventory use names that have been renamed: "
              ~ (hmsdocker_migrations_old_only[:5] | map(attribute='old') | join(', '))
              ~ ((' and ' ~ ((hmsdocker_migrations_old_only | length) - 5) ~ ' more') if hmsdocker_migrations_old_only | length > 5 else '')
              ~ ". They still work for now. Run `make update` (or `make migrate-config`) to rewrite your inventory to the new names, listed in migrations/variable_renames.yml."
            ]
            if hmsdocker_migrations_old_only | length > 0
            else []
          )
        + (
            hmsdocker_migrations_both_set
            | map(attribute='old')
            | zip(hmsdocker_migrations_both_set | map(attribute='new'))
            | map('join', ' ')
            | map('regex_replace', '^(\S+) (\S+)$', "DEPRECATED: '\1' has been renamed to '\2' and both are set (in your inventory, or '\1' with -e). '\2' is used and '\1' is ignored. Remove '\1' from your inventory, or pass '\2' with -e instead.")
            | list
          )
      }}
  vars:
    hmsdocker_migrations_both_set: "{{ hmsdocker_active_migrations | selectattr('new', 'in', hmsdocker_user_set_new_names) | list }}"
    hmsdocker_migrations_old_only: "{{ hmsdocker_active_migrations | rejectattr('new', 'in', hmsdocker_user_set_new_names) | list }}"
  when: hmsdocker_active_migrations | length > 0

# debug_mode and is_github_runner are play variables in hms-docker.yml that default to false, so
# they are only true here when they were passed with -e under their old name.
- name: (compat) Record deprecation warnings for renamed command line switches
  ansible.builtin.set_fact:
    hmsdocker_preflight_warnings: "{{ hmsdocker_preflight_warnings + ['DEPRECATED: -e ' ~ item ~ ' has been renamed, use -e hmsdocker_' ~ item ~ ' instead. The old name still works for now.'] }}"
  loop:
    - debug_mode
    - is_github_runner
  when: lookup('vars', item, default=false) | bool
