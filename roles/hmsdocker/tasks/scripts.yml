---
- name: Custom Scripts - Ensure venv pip package
  ansible.builtin.package:
    name:
      - python3-venv
    state: present

- name: Custom Scripts - Ensure pip is updated first  # noqa: package-latest
  ansible.builtin.pip:
    virtualenv: "{{ hmsdocker_data_path }}/.venv"
    virtualenv_command: "{{ ansible_python_interpreter }} -m venv"
    name:
      - pip
    state: latest

- name: Custom Scripts - Ensure pip environment
  ansible.builtin.pip:
    virtualenv: "{{ hmsdocker_data_path }}/.venv"
    virtualenv_site_packages: true
    name:
      - requests
      - python-dotenv
      - xmltodict
      - cryptography
      - docker
      - defusedxml

- name: Custom Scripts - Ensure scripts folder
  ansible.builtin.file:
    path: "{{ hmsdocker_data_path }}/scripts"
    state: directory
    owner: root
    group: root
    mode: '0755'
  register: hmsdocker_scripts_path

- name: Custom Scripts - Ensure env symlink
  ansible.builtin.file:
    state: link
    src: "{{ hmsdocker_compose_env.dest | default(hmsdocker_data_path + '/.env') }}"
    dest: "{{ hmsdocker_scripts_path.path }}/.env"
    force: "{{ ansible_check_mode }}"

- name: Custom Scripts - Plex SSL - Ensure Plex SSL script and resources
  when: hmsdocker_plex_ssl_enabled and hmsdocker_traefik_ssl_enabled
  block:
    - name: Custom Scripts - Plex SSL - Ensure pkcs12 script
      ansible.builtin.copy:
        src: scripts/traefik_cert_convert.py
        dest: "{{ hmsdocker_scripts_path.path }}"
        mode: '700'
        owner: "{{ hmsdocker_container_uid }}"
        group: "{{ hmsdocker_container_gid }}"
      register: hmsdocker_cert_script

    - name: Custom Scripts - Plex SSL - Ensure cron job
      ansible.builtin.cron:
        name: "{{ hmsdocker_project_name }}-plex-ssl"
        user: root
        job: "{{ hmsdocker_data_path }}/.venv/bin/python {{ hmsdocker_cert_script.dest | default(hmsdocker_data_path + '/scripts/traefik_cert_convert.py') }}"
        minute: 0
        hour: 5

- name: Custom Scripts - Ensure monitoring scripts
  when: hmsdocker_monitoring_scripts_enabled | default(false)
  block:
    - name: Custom Scripts - Ensure monitoring directory
      ansible.builtin.file:
        path: "{{ hmsdocker_scripts_path.path }}/monitoring"
        state: directory
        owner: root
        group: root
        mode: '0755'
      register: hmsdocker_monitoring_scripts_path

    - name: Custom Scripts - Ensure env symlink
      ansible.builtin.file:
        state: link
        src: "{{ hmsdocker_compose_env.dest | default(hmsdocker_data_path + '/.env') }}"
        dest: "{{ hmsdocker_monitoring_scripts_path.path }}/.env"
        force: "{{ ansible_check_mode }}"

    - name: Custom Scripts - Ensure monitoring scripts
      ansible.builtin.copy:
        src: scripts/monitoring
        dest: "{{ hmsdocker_scripts_path.path }}"
        mode: '0700'

    - name: Custom Scripts - Ensure media availability cron
      ansible.builtin.cron:
        name: "{{ hmsdocker_project_name }}-media-availability-monitoring"
        user: root
        job: "{{ hmsdocker_data_path }}/.venv/bin/python3 {{ hmsdocker_monitoring_scripts_path.path }}/check_media_availability.py"
        minute: "*"
