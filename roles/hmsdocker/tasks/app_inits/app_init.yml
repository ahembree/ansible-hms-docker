- name: Import API key reader task to retrieve API keys (again)
  ansible.builtin.import_tasks: "app_api_key_reader.yml"

- name: App init - Get list of app bootstrap task files in the role
  ansible.builtin.set_fact:
    hmsdocker_container_init_task_files: "{{ lookup('fileglob', role_path + '/tasks/app_inits/*.yml', wantlist=True) }}"

- name: App init - Get names of available app bootstrap files
  ansible.builtin.set_fact:
    hmsdocker_container_init_task_names: >-
      {{ hmsdocker_container_init_task_files
        | map('basename')
        | map('regex_replace', '\.yml$', '')
        | list }}

- name: App init - Slim variables and set global app variables
  ansible.builtin.set_fact:
    hmsdocker_app_inits: "{{ hmsdocker_enabled_containers | intersect(hmsdocker_container_init_task_names) }}"
    hmsdocker_app_init_config_prefix: "HMSD - "

- name: App init - Run app inits
  ansible.builtin.include_tasks: "app_inits/{{ hmsdocker_container_init_name }}.yml"
  loop: '{{ hmsdocker_app_inits }}'
  loop_control:
    loop_var: hmsdocker_container_init_name
