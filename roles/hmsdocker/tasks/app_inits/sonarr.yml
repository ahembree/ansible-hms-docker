---
- name: Sonarr bootstrap - Init Sonarr
  when: hmsdocker_app_bootstrap_sonarr_enabled
  vars:
    hmsdocker_arr_app: sonarr
    hmsdocker_arr_api_version: v3
    hmsdocker_arr_media: tv
    hmsdocker_arr_library_type: tv_shows
  block:
    - name: Sonarr bootstrap
      ansible.builtin.include_tasks: "app_inits/shared/arr_instance.yml"
      vars:
        hmsdocker_arr_label: Sonarr
        hmsdocker_arr_container: sonarr
        hmsdocker_arr_host_suffix: ""
        hmsdocker_arr_published_port: 8989
        hmsdocker_arr_api_key: "{{ api_keys.sonarr_key | default('') }}"
        hmsdocker_arr_category: tv-sonarr

    - name: Sonarr 4K bootstrap
      when: separate_4k_instances_enable
      ansible.builtin.include_tasks: "app_inits/shared/arr_instance.yml"
      vars:
        hmsdocker_arr_label: Sonarr 4K
        hmsdocker_arr_container: sonarr-4k
        hmsdocker_arr_host_suffix: "-4k"
        hmsdocker_arr_published_port: 8990
        hmsdocker_arr_api_key: "{{ api_keys.sonarr_4k_key | default('') }}"
        hmsdocker_arr_category: tv-sonarr-four-k
