---
- name: Lidarr bootstrap - Init Lidarr
  when: hmsdocker_app_bootstrap_lidarr_enabled
  vars:
    hmsdocker_arr_app: lidarr
    hmsdocker_arr_api_version: v1
    hmsdocker_arr_media: music
  block:
    - name: Lidarr bootstrap
      ansible.builtin.include_tasks: "app_inits/shared/arr_instance.yml"
      vars:
        hmsdocker_arr_label: Lidarr
        hmsdocker_arr_container: lidarr
        hmsdocker_arr_host_suffix: ""
        hmsdocker_arr_published_port: 8686
        hmsdocker_arr_api_key: "{{ api_keys.lidarr_key }}"
        hmsdocker_arr_category: music-lidarr
