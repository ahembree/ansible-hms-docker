---
- name: Radarr bootstrap - Init Radarr
  when: hmsdocker_app_bootstrap_radarr_enabled
  vars:
    hmsdocker_arr_app: radarr
    hmsdocker_arr_api_version: v3
    hmsdocker_arr_media: movie
    hmsdocker_arr_library_type: movies
  block:
    - name: Radarr bootstrap
      ansible.builtin.include_tasks: "app_inits/shared/arr_instance.yml"
      vars:
        hmsdocker_arr_label: Radarr
        hmsdocker_arr_container: radarr
        hmsdocker_arr_host_suffix: ""
        hmsdocker_arr_published_port: 7878
        hmsdocker_arr_api_key: "{{ api_keys.radarr_key | default('') }}"
        hmsdocker_arr_category: movie-radarr

    - name: Radarr 4K bootstrap
      when: separate_4k_instances_enable
      ansible.builtin.include_tasks: "app_inits/shared/arr_instance.yml"
      vars:
        hmsdocker_arr_label: Radarr 4K
        hmsdocker_arr_container: radarr-4k
        hmsdocker_arr_host_suffix: "-4k"
        hmsdocker_arr_published_port: 7879
        hmsdocker_arr_api_key: "{{ api_keys.radarr_4k_key | default('') }}"
        hmsdocker_arr_category: movie-radarr-four-k
