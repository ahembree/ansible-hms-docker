- name: Prowlarr bootstrap - Init Prowlarr
  when: hmsdocker_app_bootstrap_prowlarr_enabled
  block:
    - name: Prowlarr bootstrap - Set Prowlarr facts
      ansible.builtin.set_fact:
        hmsdocker_prowlarr_url: "http{{ 's' if hmsdocker_traefik_ssl_enabled and not 'prowlarr' in hmsdocker_expose_ports_enabled_containers }}://{{ hmsdocker_container_map['prowlarr']['proxy_host_rule'] }}.{{ hmsdocker_domain }}{{ ':9696' if 'prowlarr' in hmsdocker_expose_ports_enabled_containers }}/api"
        hmsdocker_prowlarr_api_key: "{{ hmsdocker_api_keys.prowlarr_key | default('') }}"

    - name: Prowlarr bootstrap - Precheck Prowlarr API Key
      ansible.builtin.uri:
        url: "{{ hmsdocker_prowlarr_url }}"
        method: GET
        status_code: 200
        body_format: json
        return_content: true
        headers:
          X-Api-Key: '{{ hmsdocker_prowlarr_api_key }}'
      register: hmsdocker_prowlarr_api_key_precheck
      ignore_errors: true

    - name: Prowlarr bootstrap - Ensure Prowlarr Bootstrap after API key precheck
      when: hmsdocker_prowlarr_api_key_precheck.status == 200
      block:
        - name: Prowlarr bootstrap - Get Prowlarr Tags
          ansible.builtin.uri:
            url: "{{ hmsdocker_prowlarr_url }}/v1/tag"
            method: GET
            status_code: 200
            body_format: json
            return_content: true
            headers:
              X-Api-Key: '{{ hmsdocker_prowlarr_api_key }}'
          register: hmsdocker_prowlarr_tags

        - name: Prowlarr bootstrap - Set Prowlarr Tag Facts
          ansible.builtin.set_fact:
            hmsdocker_prowlarr_tag_list: "{{ hmsdocker_prowlarr_tags.json | items2dict(key_name='label', value_name='id') }}"
            hmsdocker_prowlarr_proxy_tag_prefix: hmsd-

        - name: Prowlarr bootstrap - Create Prowlarr Tags if not exist
          when: hmsdocker_prowlarr_proxy_tag_prefix + item not in hmsdocker_prowlarr_tag_list.keys() and item in hmsdocker_enabled_containers
          ansible.builtin.uri:
            url: "{{ hmsdocker_prowlarr_url }}/v1/tag"
            method: POST
            body:
              label: "{{ hmsdocker_prowlarr_proxy_tag_prefix + item }}"
            status_code: 201
            body_format: json
            return_content: true
            headers:
              X-Api-Key: '{{ hmsdocker_prowlarr_api_key }}'
          loop:
            - flaresolverr
            - byparr
            - transmission
            - qbittorrent
            - deluge
          register: hmsdocker_prowlarr_req_add_tags
          changed_when: hmsdocker_prowlarr_req_add_tags.status == 201

        - name: Prowlarr bootstrap - Get Prowlarr Tags after creation
          ansible.builtin.uri:
            url: "{{ hmsdocker_prowlarr_url }}/v1/tag"
            method: GET
            status_code: 200
            body_format: json
            return_content: true
            headers:
              X-Api-Key: '{{ hmsdocker_prowlarr_api_key }}'
          register: hmsdocker_prowlarr_tags

        - name: Prowlarr bootstrap - Set Prowlarr Tag Facts after creation
          ansible.builtin.set_fact:
            hmsdocker_prowlarr_tag_list: "{{ hmsdocker_prowlarr_tags.json | items2dict(key_name='label', value_name='id') }}"

        - name: Prowlarr bootstrap - Get Indexer Proxies in Prowlarr
          ansible.builtin.uri:
            url: "{{ hmsdocker_prowlarr_url }}/v1/indexerproxy"
            method: GET
            status_code: 200
            body_format: json
            return_content: true
            headers:
              X-Api-Key: '{{ hmsdocker_prowlarr_api_key }}'
          register: hmsdocker_prowlarr_idx_proxies

        - name: Prowlarr bootstrap - Set Prowlarr Proxy Facts
          ansible.builtin.set_fact:
            hmsdocker_prowlarr_idx_proxies_http: "{{ hmsdocker_prowlarr_idx_proxies.json | json_query('[?implementation==`Http`]') | items2dict(key_name='name', value_name='id') }}"
            hmsdocker_prowlarr_idx_proxies_flaresolverr: "{{ hmsdocker_prowlarr_idx_proxies.json | json_query('[?implementation==`FlareSolverr`]') | items2dict(key_name='name', value_name='id') }}"

        - name: Prowlarr bootstrap - Configure HTTP indexer proxy in Prowlarr
          when:
            - hmsdocker_app_init_config_prefix + item not in hmsdocker_prowlarr_idx_proxies_http
            - item in hmsdocker_enabled_containers
            # Do not run in GitHub Actions. qBittorrent required to be on for postreqs, but does not start fully due to no actual VPN connection, so this will fail in Actions run
            - not hmsdocker_is_github_runner
          ansible.builtin.uri:
            url: "{{ hmsdocker_prowlarr_url }}/v1/indexerproxy"
            method: POST
            body: {
              name: "{{ hmsdocker_app_init_config_prefix + item }}",
              implementation: "Http",
              configContract: "HttpSettings",
              fields: [
                {
                  name: "host",
                  value: "{{ item }}"
                },
                {
                  name: "port",
                  value: "{{ '8888' if item == 'transmission' else '8118' }}"
                }
              ],
              tags: ["{{ hmsdocker_prowlarr_tag_list[hmsdocker_prowlarr_proxy_tag_prefix + item] }}"]
            }
            status_code: 201
            body_format: json
            return_content: true
            headers:
              X-Api-Key: '{{ hmsdocker_prowlarr_api_key }}'
          loop:
            - transmission
            - qbittorrent
            - deluge
          register: hmsdocker_prowlarr_req_add_idx_proxy
          changed_when: hmsdocker_prowlarr_req_add_idx_proxy.status == 201

        - name: Prowlarr bootstrap - Configure FlareSolverr indexer proxy in Prowlarr
          when:
            - hmsdocker_app_init_config_prefix + 'FlareSolverr' not in hmsdocker_prowlarr_idx_proxies_flaresolverr.keys()
            - "'flaresolverr' in hmsdocker_enabled_containers"
          ansible.builtin.uri:
            url: "{{ hmsdocker_prowlarr_url }}/v1/indexerProxy"
            method: POST
            body: {
              name: "HMSD - FlareSolverr",
              implementation: "FlareSolverr",
              configContract: "FlareSolverrSettings",
              fields: [
                {
                  name: "host",
                  value: "http://flaresolverr:8191/"
                }
              ],
              tags: ["{{ hmsdocker_prowlarr_tag_list[hmsdocker_prowlarr_proxy_tag_prefix + 'flaresolverr'] }}"]
            }
            status_code: 201
            body_format: json
            return_content: true
            headers:
              X-Api-Key: '{{ hmsdocker_prowlarr_api_key }}'
          register: hmsdocker_prowlarr_req_add_flaresolverr
          changed_when: hmsdocker_prowlarr_req_add_flaresolverr.status == 201

        # Byparr is FlareSolverr API-compatible, so it uses the same Prowlarr implementation
        - name: Prowlarr bootstrap - Configure Byparr indexer proxy in Prowlarr
          when:
            - hmsdocker_app_init_config_prefix + 'Byparr' not in hmsdocker_prowlarr_idx_proxies_flaresolverr.keys()
            - "'byparr' in hmsdocker_enabled_containers"
          ansible.builtin.uri:
            url: "{{ hmsdocker_prowlarr_url }}/v1/indexerProxy"
            method: POST
            body: {
              name: "HMSD - Byparr",
              implementation: "FlareSolverr",
              configContract: "FlareSolverrSettings",
              fields: [
                {
                  name: "host",
                  value: "http://byparr:8191/"
                }
              ],
              tags: ["{{ hmsdocker_prowlarr_tag_list[hmsdocker_prowlarr_proxy_tag_prefix + 'byparr'] }}"]
            }
            status_code: 201
            body_format: json
            return_content: true
            headers:
              X-Api-Key: '{{ hmsdocker_prowlarr_api_key }}'
          register: hmsdocker_prowlarr_req_add_byparr
          changed_when: hmsdocker_prowlarr_req_add_byparr.status == 201

        - name: Prowlarr bootstrap - Get Prowlarr configured apps
          ansible.builtin.uri:
            url: "{{ hmsdocker_prowlarr_url }}/v1/applications"
            method: GET
            status_code: 200
            body_format: json
            return_content: true
            headers:
              X-Api-Key: '{{ hmsdocker_prowlarr_api_key }}'
          register: hmsdocker_prowlarr_apps

        - name: Prowlarr bootstrap - Set Prowlarr App Facts
          ansible.builtin.set_fact:
            hmsdocker_prowlarr_sonarr_apps: "{{ hmsdocker_prowlarr_apps.json | json_query('[?implementation==`Sonarr`]') | items2dict(key_name='name', value_name='id') }}"
            hmsdocker_prowlarr_radarr_apps: "{{ hmsdocker_prowlarr_apps.json | json_query('[?implementation==`Radarr`]') | items2dict(key_name='name', value_name='id') }}"
            hmsdocker_prowlarr_lidarr_apps: "{{ hmsdocker_prowlarr_apps.json | json_query('[?implementation==`Lidarr`]') | items2dict(key_name='name', value_name='id') }}"

        - name: Prowlarr bootstrap - Configure Sonarr apps in Prowlarr
          when:
            - "'sonarr' in hmsdocker_enabled_containers"
          block:
            - name: Prowlarr bootstrap - Ensure Prowlarr Sonarr app
              when:
                - hmsdocker_app_init_config_prefix + 'Sonarr' not in hmsdocker_prowlarr_sonarr_apps.keys()
              ansible.builtin.uri:
                url: "{{ hmsdocker_prowlarr_url }}/v1/applications"
                method: POST
                body: {
                  name: "{{ hmsdocker_app_init_config_prefix + 'Sonarr' }}",
                  implementation: "Sonarr",
                  configContract: "SonarrSettings",
                  syncLevel: "fullSync",
                  fields: [
                    {
                      name: "prowlarrUrl",
                      value: "http://prowlarr:9696"
                    },
                    {
                      name: "baseUrl",
                      value: "http://sonarr:8989"
                    },
                    {
                      name: "apiKey",
                      value: "{{ hmsdocker_api_keys.sonarr_key | default('') }}"
                    }
                  ],
                }
                status_code: 201
                body_format: json
                return_content: true
                headers:
                  X-Api-Key: '{{ hmsdocker_prowlarr_api_key }}'
              register: hmsdocker_prowlarr_req_add_sonarr
              changed_when: hmsdocker_prowlarr_req_add_sonarr.status == 201

            - name: Prowlarr bootstrap - Ensure Prowlarr Sonarr 4K app
              when:
                - hmsdocker_app_init_config_prefix + 'Sonarr - 4K' not in hmsdocker_prowlarr_sonarr_apps.keys()
                - hmsdocker_separate_4k_instances_enable
              ansible.builtin.uri:
                url: "{{ hmsdocker_prowlarr_url }}/v1/applications"
                method: POST
                body: {
                  name: "{{ hmsdocker_app_init_config_prefix + 'Sonarr - 4K' }}",
                  implementation: "Sonarr",
                  configContract: "SonarrSettings",
                  syncLevel: "fullSync",
                  fields: [
                    {
                      name: "prowlarrUrl",
                      value: "http://prowlarr:9696"
                    },
                    {
                      name: "baseUrl",
                      value: "http://sonarr-4k:8989"
                    },
                    {
                      name: "apiKey",
                      value: "{{ hmsdocker_api_keys.sonarr_4k_key | default('') }}"
                    }
                  ],
                }
                status_code: 201
                body_format: json
                return_content: true
                headers:
                  X-Api-Key: '{{ hmsdocker_prowlarr_api_key }}'
              register: hmsdocker_prowlarr_req_add_sonarr_4k
              changed_when: hmsdocker_prowlarr_req_add_sonarr_4k.status == 201

        - name: Prowlarr bootstrap - Configure Radarr apps in Prowlarr
          when:
            - "'radarr' in hmsdocker_enabled_containers"
          block:
            - name: Prowlarr bootstrap - Ensure Prowlarr Radarr app
              when:
                - hmsdocker_app_init_config_prefix + 'Radarr' not in hmsdocker_prowlarr_radarr_apps.keys()
              ansible.builtin.uri:
                url: "{{ hmsdocker_prowlarr_url }}/v1/applications"
                method: POST
                body: {
                  name: "{{ hmsdocker_app_init_config_prefix + 'Radarr' }}",
                  implementation: "Radarr",
                  configContract: "RadarrSettings",
                  syncLevel: "fullSync",
                  fields: [
                    {
                      name: "prowlarrUrl",
                      value: "http://prowlarr:9696"
                    },
                    {
                      name: "baseUrl",
                      value: "http://radarr:7878"
                    },
                    {
                      name: "apiKey",
                      value: "{{ hmsdocker_api_keys.radarr_key | default('') }}"
                    }
                  ],
                }
                status_code: 201
                body_format: json
                return_content: true
                headers:
                  X-Api-Key: '{{ hmsdocker_prowlarr_api_key }}'
              register: hmsdocker_prowlarr_req_add_radarr
              changed_when: hmsdocker_prowlarr_req_add_radarr.status == 201

            - name: Prowlarr bootstrap - Ensure Prowlarr Radarr 4K app
              when:
                - hmsdocker_app_init_config_prefix + 'Radarr - 4K' not in hmsdocker_prowlarr_radarr_apps.keys()
                - hmsdocker_separate_4k_instances_enable
              ansible.builtin.uri:
                url: "{{ hmsdocker_prowlarr_url }}/v1/applications"
                method: POST
                body: {
                  name: "{{ hmsdocker_app_init_config_prefix + 'Radarr - 4K' }}",
                  implementation: "Radarr",
                  configContract: "RadarrSettings",
                  syncLevel: "fullSync",
                  fields: [
                    {
                      name: "prowlarrUrl",
                      value: "http://prowlarr:9696"
                    },
                    {
                      name: "baseUrl",
                      value: "http://radarr-4k:7878"
                    },
                    {
                      name: "apiKey",
                      value: "{{ hmsdocker_api_keys.radarr_4k_key | default('') }}"
                    }
                  ],
                }
                status_code: 201
                body_format: json
                return_content: true
                headers:
                  X-Api-Key: '{{ hmsdocker_prowlarr_api_key }}'
              register: hmsdocker_prowlarr_req_add_radarr_4k
              changed_when: hmsdocker_prowlarr_req_add_radarr_4k.status == 201

        - name: Prowlarr bootstrap - Configure Lidarr app in Prowlarr
          when:
            - "'lidarr' in hmsdocker_enabled_containers"
          block:
            - name: Prowlarr bootstrap - Ensure Prowlarr Lidarr app
              when:
                - hmsdocker_app_init_config_prefix + 'Lidarr' not in hmsdocker_prowlarr_lidarr_apps.keys()
              ansible.builtin.uri:
                url: "{{ hmsdocker_prowlarr_url }}/v1/applications"
                method: POST
                body: {
                  name: "{{ hmsdocker_app_init_config_prefix + 'Lidarr' }}",
                  implementation: "Lidarr",
                  configContract: "LidarrSettings",
                  syncLevel: "fullSync",
                  fields: [
                    {
                      name: "prowlarrUrl",
                      value: "http://prowlarr:9696"
                    },
                    {
                      name: "baseUrl",
                      value: "http://lidarr:8686"
                    },
                    {
                      name: "apiKey",
                      value: "{{ hmsdocker_api_keys.lidarr_key | default('') }}"
                    }
                  ],
                }
                status_code: 201
                body_format: json
                return_content: true
                headers:
                  X-Api-Key: '{{ hmsdocker_prowlarr_api_key }}'
              register: hmsdocker_prowlarr_req_add_lidarr
              changed_when: hmsdocker_prowlarr_req_add_lidarr.status == 201

        - name: Prowlarr bootstrap - Remove disabled resources
          when: hmsdocker_app_bootstrap_delete_unused
          block:
            - name: Prowlarr bootstrap - Remove Prowlarr Sonarr app if not enabled
              when:
                - hmsdocker_app_init_config_prefix + 'Sonarr' in hmsdocker_prowlarr_sonarr_apps.keys()
                - "'sonarr' not in hmsdocker_enabled_containers"
              ansible.builtin.uri:
                url: "{{ hmsdocker_prowlarr_url }}/v1/applications/{{ hmsdocker_prowlarr_sonarr_apps[hmsdocker_app_init_config_prefix + 'Sonarr'] }}"
                method: DELETE
                status_code: 200
                headers:
                  X-Api-Key: '{{ hmsdocker_prowlarr_api_key }}'
              register: hmsdocker_prowlarr_req_del_sonarr
              changed_when: hmsdocker_prowlarr_req_del_sonarr.status == 200

            - name: Prowlarr bootstrap - Remove Prowlarr Sonarr 4K app if not enabled
              when:
                - hmsdocker_app_init_config_prefix + 'Sonarr - 4K' in hmsdocker_prowlarr_sonarr_apps.keys()
                - "'sonarr' not in hmsdocker_enabled_containers or not hmsdocker_separate_4k_instances_enable"
              ansible.builtin.uri:
                url: "{{ hmsdocker_prowlarr_url }}/v1/applications/{{ hmsdocker_prowlarr_sonarr_apps[hmsdocker_app_init_config_prefix + 'Sonarr - 4K'] }}"
                method: DELETE
                status_code: 200
                headers:
                  X-Api-Key: '{{ hmsdocker_prowlarr_api_key }}'
              register: hmsdocker_prowlarr_req_del_sonarr_4k
              changed_when: hmsdocker_prowlarr_req_del_sonarr_4k.status == 200

            - name: Prowlarr bootstrap - Remove Prowlarr Radarr app if not enabled
              when:
                - hmsdocker_app_init_config_prefix + 'Radarr' in hmsdocker_prowlarr_radarr_apps.keys()
                - "'radarr' not in hmsdocker_enabled_containers"
              ansible.builtin.uri:
                url: "{{ hmsdocker_prowlarr_url }}/v1/applications/{{ hmsdocker_prowlarr_radarr_apps[hmsdocker_app_init_config_prefix + 'Radarr'] }}"
                method: DELETE
                status_code: 200
                headers:
                  X-Api-Key: '{{ hmsdocker_prowlarr_api_key }}'
              register: hmsdocker_prowlarr_req_del_radarr
              changed_when: hmsdocker_prowlarr_req_del_radarr.status == 200

            - name: Prowlarr bootstrap - Remove Prowlarr Radarr 4K app if not enabled
              when:
                - hmsdocker_app_init_config_prefix + 'Radarr - 4K' in hmsdocker_prowlarr_radarr_apps.keys()
                - "'radarr' not in hmsdocker_enabled_containers or not hmsdocker_separate_4k_instances_enable"
              ansible.builtin.uri:
                url: "{{ hmsdocker_prowlarr_url }}/v1/applications/{{ hmsdocker_prowlarr_radarr_apps[hmsdocker_app_init_config_prefix + 'Radarr - 4K'] }}"
                method: DELETE
                status_code: 200
                headers:
                  X-Api-Key: '{{ hmsdocker_prowlarr_api_key }}'
              register: hmsdocker_prowlarr_req_del_radarr_4k
              changed_when: hmsdocker_prowlarr_req_del_radarr_4k.status == 200

            - name: Prowlarr bootstrap - Remove Prowlarr Lidarr app if not enabled
              when:
                - hmsdocker_app_init_config_prefix + 'Lidarr' in hmsdocker_prowlarr_lidarr_apps.keys()
                - "'lidarr' not in hmsdocker_enabled_containers"
              ansible.builtin.uri:
                url: "{{ hmsdocker_prowlarr_url }}/v1/applications/{{ hmsdocker_prowlarr_lidarr_apps[hmsdocker_app_init_config_prefix + 'Lidarr'] }}"
                method: DELETE
                status_code: 200
                headers:
                  X-Api-Key: '{{ hmsdocker_prowlarr_api_key }}'
              register: hmsdocker_prowlarr_req_del_lidarr
              changed_when: hmsdocker_prowlarr_req_del_lidarr.status == 200

            - name: Prowlarr bootstrap - Remove Indexer Proxies if not enabled
              when:
                - hmsdocker_app_init_config_prefix + item in hmsdocker_prowlarr_idx_proxies_http or hmsdocker_app_init_config_prefix + item in hmsdocker_prowlarr_idx_proxies_flaresolverr
                - item | lower not in hmsdocker_enabled_containers
              ansible.builtin.uri:
                url: "{{ hmsdocker_prowlarr_url }}/v1/indexerproxy/{{ hmsdocker_prowlarr_idx_proxies_http[hmsdocker_app_init_config_prefix + item] | default(hmsdocker_prowlarr_idx_proxies_flaresolverr[hmsdocker_app_init_config_prefix + item]) }}"
                method: DELETE
                status_code: 200
                headers:
                  X-Api-Key: '{{ hmsdocker_prowlarr_api_key }}'
              register: hmsdocker_prowlarr_req_del_radarr
              changed_when: hmsdocker_prowlarr_req_del_radarr.status == 200
              loop:
                - transmission
                - qbittorrent
                - deluge
                - FlareSolverr
                - Byparr

            - name: Prowlarr bootstrap - Remove Tags if not enabled
              when:
                - hmsdocker_prowlarr_proxy_tag_prefix + item in hmsdocker_prowlarr_tag_list.keys()
                - item not in hmsdocker_enabled_containers
              ansible.builtin.uri:
                url: "{{ hmsdocker_prowlarr_url }}/v1/tag/{{ hmsdocker_prowlarr_tag_list[hmsdocker_prowlarr_proxy_tag_prefix + item] }}"
                method: DELETE
                status_code: 200
                headers:
                  X-Api-Key: '{{ hmsdocker_prowlarr_api_key }}'
              register: hmsdocker_prowlarr_req_del_radarr
              changed_when: hmsdocker_prowlarr_req_del_radarr.status == 200
              loop:
                - transmission
                - qbittorrent
                - deluge
                - flaresolverr
                - byparr
