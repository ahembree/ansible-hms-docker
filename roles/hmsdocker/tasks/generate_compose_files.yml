- name: Generate Docker Compose files for Authentik
  when: "'authentik' in hmsdocker_enabled_containers and hmsdocker_traefik_ssl_enabled | default(False)"
  ansible.builtin.template:
    src: containers/authentik.yml.j2
    dest: "{{ hmsdocker_compose_dir.dest | default(hmsdocker_data_path + '/compose_files') }}/authentik.yml"
    owner: "{{ hmsdocker_container_uid }}"
    group: "{{ hmsdocker_container_gid }}"
    mode: '0644'
    trim_blocks: true
    lstrip_blocks: true
  register: hmsdocker_authentik_compose_file_path
