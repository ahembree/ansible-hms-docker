---
# The socket proxies run as nobody (65534) with the group that owns the Docker socket,
# so they can read the Docker socket without running as root.
# follow: /var/run/docker.sock can be a symlink, and the group of the socket itself is what counts
- name: Socket Proxy Prereq - Check Docker socket
  ansible.builtin.stat:
    path: /var/run/docker.sock
    follow: true
  register: hmsdocker_socket_proxy_docker_socket

- name: Socket Proxy Prereq - Fail if the Docker socket is missing
  ansible.builtin.fail:
    msg: /var/run/docker.sock does not exist, so the socket proxies cannot reach Docker. Make sure Docker is installed and running.
  when:
    - not hmsdocker_socket_proxy_docker_socket.stat.exists
    - not ansible_check_mode

- name: Socket Proxy Prereq - Set Docker socket group
  ansible.builtin.set_fact:
    hmsdocker_socket_proxy_docker_gid: "{{ hmsdocker_socket_proxy_docker_socket.stat.gid if hmsdocker_socket_proxy_docker_socket.stat.exists else 'DOCKER_GID' }}"

- name: Socket Proxy Prereq - Ensure socket proxy directory
  ansible.builtin.file:
    path: "{{ hmsdocker_apps_path }}/socket-proxy"
    state: directory
    owner: root
    group: root
    mode: '0755'

# One directory per client: the proxy creates its filtered socket here and only that client mounts it.
- name: Socket Proxy Prereq - Ensure per-container socket directories
  ansible.builtin.file:
    path: "{{ hmsdocker_apps_path }}/socket-proxy/{{ item }}"
    state: directory
    owner: '65534'
    group: "{{ hmsdocker_socket_proxy_docker_gid if hmsdocker_socket_proxy_docker_socket.stat.exists else omit }}"
    mode: '0750'
  loop: "{{ hmsdocker_socket_proxy_enabled_containers }}"
