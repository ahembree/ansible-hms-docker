- name: (Prereq - Pocket ID) - Generate Encryption Key
  ansible.builtin.template:
    src: secret_key_file.j2
    dest: "{{ hmsdocker_apps_path + '/pocketid/config/.pocketid_encryption_key' }}"
    mode: '0600'
    owner: "{{ hmsdocker_container_uid }}"
    group: "{{ hmsdocker_container_gid }}"
    backup: true
    force: false
  no_log: "{{ not hmsdocker_debug_mode }}"
  vars:
    hmsdocker_secret_key: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=64) }}"

# Lets the playbook create the Tinyauth OIDC client through the Pocket ID API (container_postreqs/tinyauth.yml)
- name: (Prereq - Pocket ID) - Generate static API key
  ansible.builtin.template:
    src: secret_key_file.j2
    dest: "{{ hmsdocker_apps_path + '/pocketid/config/.pocketid_static_api_key' }}"
    mode: '0600'
    owner: "{{ hmsdocker_container_uid }}"
    group: "{{ hmsdocker_container_gid }}"
    force: false
  no_log: "{{ not hmsdocker_debug_mode }}"
  when: hmsdocker_tinyauth_pocketid_local | bool
  vars:
    hmsdocker_secret_key: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=64) }}"
