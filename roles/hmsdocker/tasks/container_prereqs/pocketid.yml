- name: (Prereq - Pocket ID) - Generate Encryption Key
  ansible.builtin.template:
    src: secret_key_file.j2
    dest: "{{ hms_docker_apps_path + '/pocketid/config/.pocketid_encryption_key' }}"
    mode: 0600
    owner: "{{ container_uid }}"
    group: "{{ container_gid }}"
    backup: yes
    force: no
  no_log: "{{ not debug_mode }}"
  vars:
    key: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=64) }}"
