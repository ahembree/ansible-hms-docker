- name: Tautulli Prereq - Ensure JBOPS if enabled
  when: tautulli_jbops_enabled | default(false)
  block:
    - name: Ensure global git config ignores dubious ownership permissions
      community.general.git_config:
        name: safe.directory
        scope: global
        value: "{{ hmsdocker_tautulli_jbops_install_path }}"

    # JBOPS has no releases, so this follows its default branch
    - name: Ensure JBOPS repo  # noqa: latest[git]
      ansible.builtin.git:
        repo: https://github.com/blacktwin/JBOPS
        clone: true
        dest: "{{ hmsdocker_tautulli_jbops_install_path }}"
      diff: false
      changed_when: false
