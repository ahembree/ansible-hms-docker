# No owner is set: the CrowdSec image runs as root and has no PUID/PGID support
- name: (Prereq - CrowdSec) - Ensure data and acquisition directories
  ansible.builtin.file:
    path: "{{ hms_docker_apps_path }}/crowdsec/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - data
    - config/acquis.d

# Written inside the config folder, which is mounted at /etc/crowdsec, so a changed file reaches the container
- name: (Prereq - CrowdSec) - Ensure Traefik log acquisition
  ansible.builtin.copy:
    dest: "{{ hms_docker_apps_path }}/crowdsec/config/acquis.d/traefik.yaml"
    mode: '0644'
    content: |
      source: docker
      container_name:
        - traefik
      labels:
        type: traefik
  notify: Restart crowdsec

- name: (Prereq - CrowdSec) - Generate bouncer API key
  ansible.builtin.template:
    src: secret_key_file.j2
    dest: "{{ hms_docker_apps_path }}/crowdsec/.bouncer_key"
    mode: '0600'
    force: no
  no_log: "{{ not debug_mode }}"
  register: prereq_crowdsec_bouncer_key
  vars:
    key: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=48) }}"

- name: (Prereq - CrowdSec) - Slurp bouncer API key
  ansible.builtin.slurp:
    src: "{{ prereq_crowdsec_bouncer_key.dest }}"
  register: prereq_crowdsec_slurped_bouncer_key
  check_mode: false
  # The key file does not exist yet during a first run in check mode
  ignore_errors: "{{ ansible_check_mode }}"
  when: prereq_crowdsec_bouncer_key.dest is defined
  no_log: "{{ not debug_mode }}"

# Same task as in the Traefik prereqs. Prereqs run in container map order, and a user's map can list
# crowdsec before traefik (e.g. after `make update` merges new services), so on a fresh install the
# directory may not exist yet when the middleware file below is written
- name: (Prereq - CrowdSec) - Ensure Traefik static file dir
  ansible.builtin.file:
    path: "{{ hmsdocker_traefik_static_config_location }}"
    state: directory
    mode: '0755'
    group: docker
  when: "'traefik' in enabled_containers"

- name: (Prereq - CrowdSec) - Ensure CrowdSec bouncer middleware for Traefik
  ansible.builtin.template:
    src: traefik/hmsd_traefik_crowdsec.yml.j2
    dest: "{{ hmsdocker_traefik_static_config_location }}/hmsd_crowdsec.yml"
    mode: '0640'
    group: docker
    lstrip_blocks: yes
    trim_blocks: yes
  no_log: "{{ not debug_mode }}"
  when: "'traefik' in enabled_containers"
  vars:
    crowdsec_bouncer_key: "{{ (prereq_crowdsec_slurped_bouncer_key['content'] | b64decode | trim) if prereq_crowdsec_slurped_bouncer_key['content'] is defined else '' }}"

# Traefik loads the bouncer plugin from this copy (experimental.localPlugins) instead of the Traefik plugin catalog.
# From the catalog, Traefik downloads the plugin every time its container is created, and when that fails every route
# on ports 80 and 443 breaks, because the bouncer is applied to the whole entrypoint. Each version is cloned once, at
# the pinned commit, into its own folder, and a new folder makes Compose recreate Traefik with it
- name: (Prereq - CrowdSec) - Ensure Traefik bouncer plugin
  when: "'traefik' in enabled_containers"
  vars:
    crowdsec_plugin_path: "{{ hms_docker_apps_path }}/crowdsec/bouncer-plugin/{{ hmsdocker_crowdsec_bouncer_plugin_folder }}"
  block:
    - name: (Prereq - CrowdSec) - Ensure bouncer plugin directory
      ansible.builtin.file:
        path: "{{ hms_docker_apps_path }}/crowdsec/bouncer-plugin"
        state: directory
        mode: '0755'

    # Checking out the commit, not the tag, means Git verifies the content against the pinned commit
    - name: (Prereq - CrowdSec) - Ensure bouncer plugin source
      ansible.builtin.git:
        repo: "https://{{ hmsdocker_crowdsec_bouncer_plugin_module }}.git"
        dest: "{{ crowdsec_plugin_path }}"
        version: "{{ hmsdocker_crowdsec_bouncer_plugin_commit }}"
        update: false
      diff: false

    - name: (Prereq - CrowdSec) - Get the commit of the bouncer plugin release tag
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ crowdsec_plugin_path }}"
          - rev-parse
          - --verify
          - --quiet
          - "refs/tags/{{ hmsdocker_crowdsec_bouncer_plugin_version }}^{commit}"
      register: prereq_crowdsec_plugin_tag
      changed_when: false
      failed_when: false
      when: not ansible_check_mode

    - name: (Prereq - CrowdSec) - Ensure the bouncer plugin release tag matches the pinned commit
      ansible.builtin.assert:
        that:
          - prereq_crowdsec_plugin_tag.rc == 0
          - prereq_crowdsec_plugin_tag.stdout | trim == hmsdocker_crowdsec_bouncer_plugin_commit
        fail_msg: >-
          The CrowdSec bouncer plugin tag {{ hmsdocker_crowdsec_bouncer_plugin_version }} points to
          {{ (prereq_crowdsec_plugin_tag.stdout | default('') | trim) or 'nothing (the tag does not exist)' }},
          not to hmsdocker_crowdsec_bouncer_plugin_commit ({{ hmsdocker_crowdsec_bouncer_plugin_commit }}).
          When you change hmsdocker_crowdsec_bouncer_plugin_version, also set hmsdocker_crowdsec_bouncer_plugin_commit
          in inventory/group_vars/all/crowdsec.yml to the commit of that release. If you did not change either, the
          upstream tag was moved: check the plugin's releases before trusting it.
        quiet: true
      when: not ansible_check_mode
