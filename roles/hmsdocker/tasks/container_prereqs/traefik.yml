---
- name: Traefik Prereq - Extend Traefik subdomain hosts list
  ansible.builtin.set_fact:
    hmsdocker_traefik_enabled_subdomains: "{{ hmsdocker_traefik_enabled_subdomains + [item.subdomain_name] }}"
  when:
    - item.enabled
    - item.subdomain_name not in hmsdocker_traefik_enabled_subdomains
  loop: '{{ hmsdocker_traefik_ext_hosts_list }}'

- name: Traefik Prereq - Extend Traefik subdomain hosts list if 4K instances are enabled
  ansible.builtin.set_fact:
    hmsdocker_traefik_enabled_subdomains: "{{ hmsdocker_traefik_enabled_subdomains + [item + '-4k'] }}"
  when:
    - hmsdocker_separate_4k_instances_enable
    - item in hmsdocker_traefik_enabled_containers
  loop:
    - sonarr
    - radarr

- name: Traefik Prereq - Ensure Traefik config.
  ansible.builtin.template:
    src: traefik/hmsd_traefik_config.yml.j2
    dest: "{{ hmsdocker_apps_path }}/traefik/config/traefik.yml"
    mode: '0644'
    group: docker
    backup: true
    lstrip_blocks: true
    trim_blocks: true
  notify: Restart traefik

- name: Traefik Prereq - Ensure Traefik certs directory
  ansible.builtin.file:
    path: "{{ hmsdocker_apps_path }}/traefik/config/certs"
    state: directory
    mode: '0755'
  register: hmsdocker_traefik_certs_dir

- name: Traefik Prereq - Ensure Traefik Static file dir
  ansible.builtin.file:
    path: "{{ hmsdocker_traefik_static_config_location }}"
    state: directory
    mode: '0755'
    group: docker
  register: hmsdocker_traefik_static_config_dir

- name: Traefik Prereq - Ensure Traefik static config file
  ansible.builtin.template:
    src: traefik/hmsd_traefik_middlewares.yml.j2
    dest: "{{ hmsdocker_traefik_static_config_dir.path }}/hmsd_middlewares.yml"
    mode: '0644'
    group: docker
    lstrip_blocks: true
    trim_blocks: true

- name: Traefik Prereq - Ensure Traefik static external host configs
  ansible.builtin.template:
    src: traefik/hmsd_traefik_additional_routes.yml.j2
    dest: "{{ hmsdocker_traefik_static_config_dir.path }}/{{ item.friendly_name | map('regex_replace', hmsdocker_sanitize_regex, hmsdocker_sanitize_replace) | list | join }}.yml"
    mode: '0644'
    group: docker
    lstrip_blocks: true
    trim_blocks: true
  loop: "{{ hmsdocker_traefik_ext_hosts_list }}"
  when:
    - hmsdocker_traefik_ext_hosts_enabled
    - item.friendly_name is defined and item.friendly_name != ''
    - item.subdomain_name is defined and item.subdomain_name != ''
    - item.backend_url is defined and item.backend_url != ''
    - item.enabled is defined and item.enabled

- name: Traefik Prereq - Ensure disabled Traefik static external host configs are removed
  ansible.builtin.file:
    path: "{{ hmsdocker_traefik_static_config_dir.path }}/{{ item.friendly_name | map('regex_replace', hmsdocker_sanitize_regex, hmsdocker_sanitize_replace) | list | join }}.yml"
    state: absent
  loop: "{{ hmsdocker_traefik_ext_hosts_list }}"
  when:
    - not item.enabled or not hmsdocker_traefik_ext_hosts_enabled
