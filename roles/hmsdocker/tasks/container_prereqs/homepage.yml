---
- name: Homepage Prereq - Ensure Watchtower API key
  ansible.builtin.template:
    src: secret_key_file.j2
    dest: "{{ hmsdocker_data_path }}/.watchtower.key"
    mode: '0600'
    owner: "{{ hmsdocker_container_uid }}"
    group: "{{ hmsdocker_container_gid }}"
    force: false
  no_log: "{{ not hmsdocker_debug_mode }}"
  register: hmsdocker_watchtower_key_output
  vars:
    hmsdocker_secret_key: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters') }}"

- name: Homepage Prereq - Slurp Watchtower key data
  ansible.builtin.slurp:
    src: "{{ hmsdocker_watchtower_key_output.dest }}"
  register: hmsdocker_slurped_watchtower_key_data
  check_mode: false
  when: hmsdocker_watchtower_key_output.dest is defined
  no_log: "{{ not hmsdocker_debug_mode }}"

- name: Homepage Prereq - Ensure homepage docker config
  ansible.builtin.copy:
    src: homepage_docker.yaml
    dest: "{{ hmsdocker_apps_path }}/homepage/config/docker.yaml"
    mode: '0644'
    owner: "{{ hmsdocker_container_uid }}"
    group: "{{ hmsdocker_container_gid }}"
    force: false
  register: hmsdocker_homepage_docker_config

# Points the Docker host at the filtered socket when Homepage uses the socket proxy, and back otherwise.
# Only the two socket paths the playbook manages are changed (quoted or not, with or without a trailing
# comment), anything else in docker.yaml is left alone.
- name: Homepage Prereq - Ensure homepage Docker socket path
  ansible.builtin.replace:
    path: "{{ hmsdocker_apps_path }}/homepage/config/docker.yaml"
    regexp: '^([ \t]*socket:[ \t]*)(["'']?)(/var/run/docker\.sock|{{ hmsdocker_socket_proxy_client_dir | regex_escape }}/docker\.sock)\2([ \t]*(#.*)?)$'
    replace: '\g<1>\g<2>{{ hmsdocker_homepage_docker_socket }}\g<2>\g<4>'
  vars:
    hmsdocker_homepage_docker_socket: "{{ (hmsdocker_socket_proxy_client_dir ~ '/docker.sock') if 'homepage' in hmsdocker_socket_proxy_enabled_containers else '/var/run/docker.sock' }}"
  # In check mode a new docker.yaml is not written, so there is nothing to change yet
  when: not (ansible_check_mode and hmsdocker_homepage_docker_config is changed)

- name: Homepage Prereq - Ensure homepage services config
  ansible.builtin.copy:
    src: homepage_services.yaml
    dest: "{{ hmsdocker_apps_path }}/homepage/config/services.yaml"
    mode: '0644'
    owner: "{{ hmsdocker_container_uid }}"
    group: "{{ hmsdocker_container_gid }}"
    force: false
