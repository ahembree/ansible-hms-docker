---
- name: HMS-Docker
  hosts: all
  become: true
  gather_facts: true
  vars:
    # Must be a QUOTED 3-part semver (X.Y.Z) — unquoted values like 1.20 parse
    # as the YAML float 1.2 and break the version comparison.
    hmsdocker_current_version: "1.22.0"
    hmsdocker_version_file: "{{ hmsdocker_data_path }}/.hmsd-version"
    hmsdocker_sanitize_regex: '[^A-Za-z0-9._-]'
    hmsdocker_sanitize_replace: '_'

    # Switches that are only meant to be set on the command line (-e hmsdocker_debug_mode=true).
    # debug_mode and is_github_runner are their old names. They stay play variables, and are not
    # in migrations/variable_renames.yml, so that they keep behaving as they always did: -e sets
    # them, and a value in the inventory is ignored because play variables outrank it.
    debug_mode: false
    is_github_runner: false
    hmsdocker_debug_mode: "{{ debug_mode }}"
    hmsdocker_is_github_runner: "{{ is_github_runner }}"

    # GPU-specific Docker daemon settings (not user-overridable — required for the GPU integration)
    hmsdocker_docker_daemon_options_gpu:
      runtimes:
        nvidia:
          args: []
          path: nvidia-container-runtime

    # Merge Docker daemon settings
    docker_daemon_options: >-
      {{
        hmsdocker_docker_daemon_options_base
        | combine(hmsdocker_docker_daemon_options_gpu if hmsdocker_enable_nvidia_gpu | default(false) else {}, recursive=True)
      }}

  # Preflight runs first so misconfigurations fail before any host mutation
  # (gpu drivers, dockerd reconfig, etc.).
  pre_tasks:
    - name: Run hmsdocker preflight validation
      ansible.builtin.import_role:
        name: hmsdocker
        tasks_from: preflight

    - name: Ensure Nvidia GPU role if enabled
      ansible.builtin.import_role:
        name: gpu
      when: hmsdocker_enable_nvidia_gpu | default(false)

  roles:
    # Docker role automatically flushes handlers (restarts Docker service) after configuring daemon.json
    - galaxy-roles/geerlingguy.docker

  tasks:
    - name: (GPU Validation) Verify CUDA container works
      when: hmsdocker_enable_nvidia_gpu | default(false)
      block:
        - name: Run CUDA container
          community.docker.docker_container:
            name: nvidia-gpu-validation
            image: ubuntu
            command: nvidia-smi
            runtime: nvidia
            state: started
            device_requests:
              - driver: nvidia
                count: -1
                capabilities:
                  - gpu
          ignore_errors: '{{ ansible_check_mode }}'
          changed_when: false

        - name: (GPU Validation) Remove CUDA container
          community.docker.docker_container:
            name: nvidia-gpu-validation
            state: absent
          ignore_errors: '{{ ansible_check_mode }}'
          changed_when: false

    - name: Ensure Unifi DNS role to manage records before theyre used in playbook
      ansible.builtin.import_role:
        name: unifi_dns
      when: unifi_dns_enabled | default(false)

    - name: Ensure HMS-Docker role
      ansible.builtin.import_role:
        name: hmsdocker
