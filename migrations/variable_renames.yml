---
# Single source of truth for deprecated -> new inventory variable renames.
#
# `renames` is consumed by:
#   - roles/hmsdocker/tasks/compat_shim.yml
#       Aliases old -> new in-memory during a playbook run so users who
#       have not yet rewritten their inventory still get a working apply.
#   - migrations/apply_renames.py (run by `make update` / `make migrate-config`)
#       Rewrites the inventory files under inventory/group_vars/all so the
#       rename is persisted at upgrade time: top-level keys, and references
#       to them inside {{ ... }}.
#
# To register a new rename, append an entry to `renames` below, one per line
# and in exactly this form:
#   - { old: old_name, new: new_name }
# Both consumers pick it up automatically, no other file edits required.
# Always point `old` at the name the variable has now, never at another
# `old` name: when a variable is renamed a second time, update the `new` of
# its earlier entries too.
#
# Entries describe top-level YAML keys. Nested-key renames need bespoke
# handling and are not covered by this file.

# DO NOT EDIT OR REMOVE. Makefiles up to v1.20 keep running their own
# 'make update' recipe after 'git pull' and rename the keys listed here with
# sed, without updating references to them. It is frozen at the renames those
# releases shipped with; everything newer belongs in `renames`.
variable_renames:
  - { old: traefik_ext_hosts_configs_path, new: hmsdocker_traefik_static_config_location }
  - { old: hms_docker_library_path, new: hmsdocker_library_path }
  - { old: transmission_vpn_provider, new: hmsdocker_vpn_provider }
  - { old: transmission_vpn_user, new: hmsdocker_vpn_user }
  - { old: transmission_vpn_pass, new: hmsdocker_vpn_pass }
  - { old: transmission_ovpn_config_local_path, new: transmission_ovpn_config_local_dir }
  - { old: hms_docker_plex_ssl_subdomain, new: hms_docker_plex_ssl_public_hostname }

