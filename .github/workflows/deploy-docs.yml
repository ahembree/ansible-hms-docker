name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'docs-astro/**'
      - 'roles/hmsdocker/defaults/main/container_map.yml'
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Astro Docs
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v6
        with:
          # Full history so Starlight's git-based "last updated" dates (also used for
          # the dateModified/article:modified_time SEO metadata) are accurate per page
          fetch-depth: 0

      - name: Copy container_map config to site
        run: |
          mkdir -p docs-astro/public/configs
          # Only Makefiles up to v1.20 download this file: their `make update` merges it into the user's
          # container map, adds the keys the user's entries lack and deletes the ones this file lacks.
          # So it is published the way those Makefiles know the map: under its old top-level key, and
          # with the per-container `proxy` key under its old name `traefik`. Published with `proxy`, that
          # merge would delete the user's `traefik` setting and add `proxy` with the default value.
          # The playbook and the next `make update` then rename `traefik` to `proxy`, keeping the value.
          sed -E 's/^hmsdocker_container_map:/hms_docker_container_map:/; s/^(    )proxy:/\1traefik:/' roles/hmsdocker/defaults/main/container_map.yml > docs-astro/public/configs/container_map.yml
          grep -q '^hms_docker_container_map:' docs-astro/public/configs/container_map.yml
          grep -q '^    traefik:' docs-astro/public/configs/container_map.yml
          if grep -q '^    proxy:' docs-astro/public/configs/container_map.yml; then echo "a proxy key was left in the published map"; exit 1; fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: docs-astro/package-lock.json

      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          path: docs-astro # The root location of your Astro project inside the repository. (optional)
        # env:
          # PUBLIC_POKEAPI: 'https://pokeapi.co/api/v2' # Use single quotation marks for the variable value. (optional)

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
