name: Test Astro Docs Build

on:
  # Branch pushes are covered by the pull_request trigger; only test
  # long-lived branches on push so PR commits don't run twice.
  push:
    branches:
      - master
      - develop
    paths:
      - 'docs-astro/**'
      - 'roles/hmsdocker/defaults/main/container_map.yml'
  pull_request:
    branches:
      - master
      - develop
    paths:
      - 'docs-astro/**'
      - 'roles/hmsdocker/defaults/main/container_map.yml'
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read

jobs:
  build:
    name: Test and Build Astro Docs
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v6

      - name: Copy container_map config to site
        run: |
          mkdir -p docs-astro/public/configs
          # Only Makefiles up to v1.20 download this file (their `make update` merges it into the
          # user's container map), and they look for the map under its old top-level key
          sed 's/^hmsdocker_container_map:/hms_docker_container_map:/' roles/hmsdocker/defaults/main/container_map.yml > docs-astro/public/configs/container_map.yml
          grep -q '^hms_docker_container_map:' docs-astro/public/configs/container_map.yml

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: docs-astro/package-lock.json

      - name: Check Astro before Build
        run: |
          cd docs-astro
          npm install
          npm run astro check

      - name: Install and build
        uses: withastro/action@v6
        with:
          path: docs-astro # The root location of your Astro project inside the repository. (optional)
        # env:
          # PUBLIC_POKEAPI: 'https://pokeapi.co/api/v2' # Use single quotation marks for the variable value. (optional)
