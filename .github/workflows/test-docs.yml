name: Test Astro Docs Build

on:
  # Branch pushes are covered by the pull_request trigger; only test
  # long-lived branches on push so PR commits don't run twice.
  push:
    branches:
      - master
      - develop
    paths:
      - 'docs-astro/**'
      - 'roles/hmsdocker/defaults/main/container_map.yml'
      - '.github/workflows/test-docs.yml'
  pull_request:
    branches:
      - master
      - develop
    # No paths filter on pull_request: these jobs are required checks on
    # master, and a path-filtered workflow never reports, leaving the PR stuck
    # on "Expected". The job always runs and skips its steps when nothing
    # relevant changed, so the check still reports success under the same name.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read

jobs:
  build:
    name: Test and Build Astro Docs
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect relevant changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          PATTERN: '^(docs-astro/|roles/hmsdocker/defaults/main/container_map\.yml$|\.github/workflows/test-docs\.yml$)'
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Checkout is the PR merge commit; its first parent is the base tip.
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE "$PATTERN"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No relevant files changed; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy container_map config to site
        if: steps.changes.outputs.run == 'true'
        run: |
          mkdir -p docs-astro/public/configs
          cp roles/hmsdocker/defaults/main/container_map.yml docs-astro/public/configs/container_map.yml

      - name: Setup Node.js
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: docs-astro/package-lock.json

      - name: Check Astro before Build
        if: steps.changes.outputs.run == 'true'
        run: |
          cd docs-astro
          npm install
          npm run astro check

      - name: Install and build
        if: steps.changes.outputs.run == 'true'
        uses: withastro/action@v6
        with:
          path: docs-astro # The root location of your Astro project inside the repository. (optional)
        # env:
          # PUBLIC_POKEAPI: 'https://pokeapi.co/api/v2' # Use single quotation marks for the variable value. (optional)
